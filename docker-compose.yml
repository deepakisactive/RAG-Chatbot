services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # RAG Application & Streamlit Frontend
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://10.0.2.2:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_TIMEOUT_SECONDS=300.0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-rag_documents}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIMENSION=384
      - DISTANCE_METRIC=Cosine
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=64
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.35
      - SQLITE_DB_PATH=/app/metadata/rag.db
      - UPLOAD_DIR=/app/data/documents
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./evaluation:/app/evaluation
      - ./tests:/app/tests
      - ./data/documents:/app/data/documents
      - ./metadata:/app/metadata
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
    name: rag_qdrant_storage
